# Regenera la tarjeta de estadísticas del perfil.
name: Actualizar perfil

on:
  schedule:
    - cron: "0 6 * * *" # todos los días (1:00 a. m. hora Colombia)
  workflow_dispatch:
  push:
    paths: [".github/workflows/profile.yml", "scripts/stats_card.py"]

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generar tarjeta de estadísticas
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/stats_card.py assets "${{ github.repository_owner }}"
      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats.svg assets/stats-en.svg
          git diff --cached --quiet || { git commit -m "Actualiza las estadísticas" && git push; }
