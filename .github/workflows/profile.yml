# Regenera las tarjetas de estadísticas y la serpiente de contribuciones del perfil.
name: Actualizar perfil

on:
  schedule:
    - cron: "0 6 * * *" # todos los días (1:00 a. m. hora Colombia)
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/profile.yml"]

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          # Si las tarjetas salen vacías, crea un token personal y guárdalo como secreto SUMMARY_GITHUB_TOKEN
          GITHUB_TOKEN: ${{ secrets.SUMMARY_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          BRANCH_NAME: main
          TIME_ZONE: America/Bogota
          THEME: tokyonight

  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#7F5AF0
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#00D4FF
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
