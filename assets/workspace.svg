 y="132" font-size="12" fill="#484F58" text-anchor="end">3</text><text class="m c2" x="70" y="132" font-size="13" fill="#C9D1D9" xml:space="preserve">    focus = [<tspan fill="#A5D6FF">"backend"</tspan>, <tspan fill="#A5D6FF">"data"</tspan>, <tspan fill="#A5D6FF">"cloud"</tspan>]</text><text class="m" x="54" y="155" font-size="12" fill="#484F58" text-anchor="end">4</text><text class="m" x="54" y="178" font-size="12" fill="#484F58" text-anchor="end">5</text><text class="m c4" x="70" y="178" font-size="13" fill="#C9D1D9" xml:space="preserve">    <tspan fill="#B392F0">def</tspan> <tspan fill="#79C0FF">solve</tspan>(self, problem):</text><text class="m" x="54" y="201" font-size="12" fill="#484F58" text-anchor="end">6</text><text class="m c5" x="70" y="201" font-size="13" fill="#C9D1D9" xml:space="preserve">        req  = <tspan fill="#79C0FF">analyze</tspan>(problem)</text><text class="m" x="54" y="224" font-size="12" fill="#484F58" text-anchor="end">7</text><text class="m c6" x="70" y="224" font-size="13" fill="#C9D1D9" xml:space="preserve">        arch = <tspan fill="#79C0FF">design</tspan>(req)</text><text class="m" x="54" y="247" font-size="12" fill="#484F58" text-anchor="end">8</text><text class="m c7" x="70" y="247" font-size="13" fill="#C9D1D9" xml:space="preserve">        app  = <tspan fill="#79C0FF">build</tspan>(arch)</text><text class="m" x="54" y="270" font-size="12" fill="#484F58" text-anchor="end">9</text><text class="m c8" x="70" y="270" font-size="13" fill="#C9D1D9" xml:space="preserve">        <tspan fill="#79C0FF">test</tspan>(app)</text><text class="m" x="54" y="293" font-size="12" fill="#484F58" text-anchor="end">10</text><text class="m c9" x="70" y="293" font-size="13" fill="#C9D1D9" xml:space="preserve">        <tspan fill="#B392F0">return</tspan> <tspan fill="#79C0FF">deploy</tspan>(app)</text><rect x="510" y="24" width="320" height="172" rx="10" fill="#0D1117" stroke="#30363D"/><path d="M510 58 h320" stroke="#30363D"/><circle cx="528" cy="41" r="