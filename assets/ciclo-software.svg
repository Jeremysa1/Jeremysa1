<svg xmlns="http://www.w3.org/2000/svg" width="854" height="380" viewBox="0 0 854 380" role="img" aria-label="Ciclo de vida del software: del problema a la solución">
<title>Ciclo de vida del software</title>
<defs>
  <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#00D4FF"/><stop offset="1" stop-color="#7F5AF0"/>
  </linearGradient>
  <radialGradient id="glow"><stop offset="0" stop-color="#00D4FF" stop-opacity=".9"/><stop offset="1" stop-color="#00D4FF" stop-opacity="0"/></radialGradient>
  <radialGradient id="bgGlow" cx="0.275" cy=".5" r=".55"><stop offset="0" stop-color="#7F5AF0" stop-opacity=".16"/><stop offset="1" stop-color="#7F5AF0" stop-opacity="0"/></radialGradient>
</defs>
<style>
  text { font-family: ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace; }
  .node { fill: #0D1117; stroke: #30363D; stroke-width: 2; }
  .node, .lbl, .seg { animation: on 15.4s linear infinite; animation-fill-mode: backwards; }
  .lbl { fill: #8B949E; font-size: 13px; }
  .seg { fill: #30363D; }
  .panel { opacity: 0; animation: show 15.4s linear infinite; animation-fill-mode: backwards; }
  @keyframes on {
    0%, 13.79% { fill: #00D4FF; stroke: #00D4FF; }
    14.29%, 100% { }
  }
  .lbl { animation-name: lblOn; }
  @keyframes lblOn { 0%, 13.79% { fill: #E6EDF3; font-weight: 700; } 14.29%, 100% { fill: #8B949E; } }
  @keyframes show {
    0% { opacity: 0; transform: translateY(6px); }
    2% { opacity: 1; transform: none; }
    12.79% { opacity: 1; transform: none; }
    13.99%, 100% { opacity: 0; }
  }
  @media (prefers-reduced-motion: reduce) { .node, .lbl, .seg, .panel { animation: none; } .panel.p0 { opacity: 1; } }
</style>
<rect width="854" height="380" rx="14" fill="#0D1117"/>
<rect width="854" height="380" rx="14" fill="url(#bgGlow)"/>
<rect x=".5" y=".5" width="853" height="379" rx="14" fill="none" stroke="#30363D"/>
<text x="500" y="84" font-size="13" fill="#8B949E">// ciclo de vida del software</text>

<circle cx="235" cy="196" r="118" fill="none" stroke="#30363D" stroke-width="2"/>
<circle cx="235" cy="196" r="118" fill="none" stroke="url(#ring)" stroke-width="3" stroke-linecap="round" stroke-dasharray="741.4" transform="rotate(-90 235 196)"><animate attributeName="stroke-dashoffset" values="741.4;0" dur="15.4s" repeatCount="indefinite"/></circle>
<text x="235" y="190" text-anchor="middle" font-size="30" font-weight="700" fill="#E6EDF3">&lt;/&gt;</text>
<text x="235" y="216" text-anchor="middle" font-size="12" fill="#8B949E">problema → solución</text>
<circle class="node" cx="235.0" cy="78.0" r="8" style="animation-delay:-1.10s"/>
<text class="lbl" x="235.0" y="50.0" text-anchor="middle" style="animation-delay:-1.10s">Problema</text>
<circle class="node" cx="327.3" cy="122.4" r="8" style="animation-delay:1.10s"/>
<text class="lbl" x="346.0" y="111.5" text-anchor="start" style="animation-delay:1.10s">Análisis</text>
<circle class="node" cx="350.0" cy="222.3" r="8" style="animation-delay:3.30s"/>
<text class="lbl" x="373.4" y="231.6" text-anchor="start" style="animation-delay:3.30s">Diseño</text>
<circle class="node" cx="286.2" cy="302.3" r="8" style="animation-delay:5.50s"/>
<text class="lbl" x="296.6" y="335.9" text-anchor="start" style="animation-delay:5.50s">Desarrollo</text>
<circle class="node" cx="183.8" cy="302.3" r="8" style="animation-delay:7.70s"/>
<text class="lbl" x="173.4" y="335.9" text-anchor="end" style="animation-delay:7.70s">Pruebas</text>
<circle class="node" cx="120.0" cy="222.3" r="8" style="animation-delay:9.90s"/>
<text class="lbl" x="96.6" y="231.6" text-anchor="end" style="animation-delay:9.90s">Despliegue</text>
<circle class="node" cx="142.7" cy="122.4" r="8" style="animation-delay:12.10s"/>
<text class="lbl" x="124.0" y="111.5" text-anchor="end" style="animation-delay:12.10s">Solución</text>
<g><circle r="16" fill="url(#glow)"/><circle r="5" fill="#fff"/><animateMotion dur="15.4s" repeatCount="indefinite" path="M 235 78 A 118 118 0 1 1 235 314 A 118 118 0 1 1 235 78"/></g>
<line x1="468" y1="70" x2="468" y2="330" stroke="#30363D"/>
<g class="panel p0" style="animation-delay:-1.10s">
<text x="500" y="128" font-size="14" fill="#7F5AF0" font-weight="700">FASE 01 / 07</text>
<text x="500" y="176" font-size="38" font-weight="700" fill="#E6EDF3">Problema</text>
<text x="500" y="214" font-size="16" fill="#8B949E">Entender el dolor real</text>
<text x="500" y="238" font-size="16" fill="#8B949E">antes de escribir una línea.</text>
</g>
<g class="panel p1" style="animation-delay:1.10s">
<text x="500" y="128" font-size="14" fill="#7F5AF0" font-weight="700">FASE 02 / 07</text>
<text x="500" y="176" font-size="38" font-weight="700" fill="#E6EDF3">Análisis</text>
<text x="500" y="214" font-size="16" fill="#8B949E">Usuarios, requisitos</text>
<text x="500" y="238" font-size="16" fill="#8B949E">y restricciones.</text>
</g>
<g class="panel p2" style="animation-delay:3.30s">
<text x="500" y="128" font-size="14" fill="#7F5AF0" font-weight="700">FASE 03 / 07</text>
<text x="500" y="176" font-size="38" font-weight="700" fill="#E6EDF3">Diseño</text>
<text x="500" y="214" font-size="16" fill="#8B949E">Arquitectura, modelo de datos</text>
<text x="500" y="238" font-size="16" fill="#8B949E">y contratos de API.</text>
</g>
<g class="panel p3" style="animation-delay:5.50s">
<text x="500" y="128" font-size="14" fill="#7F5AF0" font-weight="700">FASE 04 / 07</text>
<text x="500" y="176" font-size="38" font-weight="700" fill="#E6EDF3">Desarrollo</text>
<text x="500" y="214" font-size="16" fill="#8B949E">Código limpio, revisado</text>
<text x="500" y="238" font-size="16" fill="#8B949E">y versionado con Git.</text>
</g>
<g class="panel p4" style="animation-delay:7.70s">
<text x="500" y="128" font-size="14" fill="#7F5AF0" font-weight="700">FASE 05 / 07</text>
<text x="500" y="176" font-size="38" font-weight="700" fill="#E6EDF3">Pruebas</text>
<text x="500" y="214" font-size="16" fill="#8B949E">Validar que funciona</text>
<text x="500" y="238" font-size="16" fill="#8B949E">y que no se rompe.</text>
</g>
<g class="panel p5" style="animation-delay:9.90s">
<text x="500" y="128" font-size="14" fill="#7F5AF0" font-weight="700">FASE 06 / 07</text>
<text x="500" y="176" font-size="38" font-weight="700" fill="#E6EDF3">Despliegue</text>
<text x="500" y="214" font-size="16" fill="#8B949E">Contenedores, CI/CD</text>
<text x="500" y="238" font-size="16" fill="#8B949E">y entrega continua.</text>
</g>
<g class="panel p6" style="animation-delay:12.10s">
<text x="500" y="128" font-size="14" fill="#7F5AF0" font-weight="700">FASE 07 / 07</text>
<text x="500" y="176" font-size="38" font-weight="700" fill="#E6EDF3">Solución</text>
<text x="500" y="214" font-size="16" fill="#8B949E">Valor real para el usuario...</text>
<text x="500" y="238" font-size="16" fill="#8B949E">y se vuelve a iterar.</text>
</g>
<rect class="seg" x="500" y="282" width="40" height="5" rx="2.5" style="animation-delay:-1.10s"/>
<rect class="seg" x="546" y="282" width="40" height="5" rx="2.5" style="animation-delay:1.10s"/>
<rect class="seg" x="592" y="282" width="40" height="5" rx="2.5" style="animation-delay:3.30s"/>
<rect class="seg" x="638" y="282" width="40" height="5" rx="2.5" style="animation-delay:5.50s"/>
<rect class="seg" x="684" y="282" width="40" height="5" rx="2.5" style="animation-delay:7.70s"/>
<rect class="seg" x="730" y="282" width="40" height="5" rx="2.5" style="animation-delay:9.90s"/>
<rect class="seg" x="776" y="282" width="40" height="5" rx="2.5" style="animation-delay:12.10s"/>
<text x="500" y="318" font-size="12" fill="#8B949E">Así construyo software.</text>
</svg>
